name: Foundation CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  python-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: edge/pyproject.toml
      - name: Install foundation tooling
        run: python -m pip install --disable-pip-version-check -e "./edge[dev]"
      - name: Run repository checks
        run: make check
