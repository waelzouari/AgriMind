name: Foundation CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  python-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            edge/pyproject.toml
            backend/services/ingestion/pyproject.toml
            backend/services/weather/pyproject.toml
            ai/irrigation/pyproject.toml
      - name: Install foundation tooling
        run: |
          python -m pip install --disable-pip-version-check -e "./edge[dev]"
          python -m pip install --disable-pip-version-check -e "./backend/services/ingestion[dev]"
          python -m pip install --disable-pip-version-check -e "./backend/services/weather[dev]"
          python -m pip install --disable-pip-version-check -e "./ai/irrigation[dev]"
      - name: Run repository checks
        run: make check

  supabase-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate migrations, constraints, RLS, and isolation twice
        run: python3 scripts/test_supabase_schema.py
