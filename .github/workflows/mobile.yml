name: Mobile CI

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "mobile/**"
      - "edge/tests/test_p0_e2e.py"
      - "docs/testing/p0-e2e-matrix.md"
      - ".github/workflows/mobile.yml"
  push:
    branches: [develop, main]
    paths:
      - "mobile/**"
      - "edge/tests/test_p0_e2e.py"
      - "docs/testing/p0-e2e-matrix.md"
      - ".github/workflows/mobile.yml"

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
