[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrimind-irrigation"
version = "0.0.0"
description = "AgriMind irrigation dataset contract and read-only audit tooling"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
training = [
  "scikit-learn>=1.9,<1.10",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "scikit-learn>=1.9,<1.10",
]

[project.scripts]
agrimind-irrigation-audit = "agrimind_irrigation.audit:main"
agrimind-irrigation-training = "agrimind_irrigation.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
ignore_missing_imports = true
