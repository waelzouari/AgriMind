[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrimind-cv-inference"
version = "0.1.0"
description = "Secured farm-scoped AgriMind CV inference API"
requires-python = ">=3.11"
dependencies = [
  "agrimind-cv==0.3.0",
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
runtime = ["torch==2.5.1", "torchvision==0.20.1"]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
agrimind-cv-inference = "agrimind_cv_inference.entrypoints.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]
