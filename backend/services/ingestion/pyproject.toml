[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrimind-ingestion"
version = "0.0.0"
description = "Trusted AgriMind MQTT-to-Supabase ingestion service"
requires-python = ">=3.11"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "paho-mqtt>=2.1,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
agrimind-ingestion = "agrimind_ingestion.entrypoints.service:main"
agrimind-device-registry = "agrimind_ingestion.entrypoints.registry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src"]
