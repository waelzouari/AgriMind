[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agrimind-edge"
version = "0.0.0"
description = "AgriMind edge service foundation"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.1,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
agrimind-mqtt-validate = "agrimind_edge.entrypoints.mqtt_validate:main"
agrimind-mqtt-control-validate = "agrimind_edge.entrypoints.mqtt_control_validate:main"

[project.optional-dependencies]
hardware = [
  "adafruit-blinka>=8.0",
  "adafruit-circuitpython-ads1x15>=2.2.23",
  "adafruit-circuitpython-dht>=3.7.8",
  "RPi.GPIO>=0.7.1",
]
dev = [
  "detect-secrets>=1.5,<2",
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
files = ["src", "../scripts"]
